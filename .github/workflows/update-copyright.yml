name: Update Copyright

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - scripts/**

concurrency:
  group: copyright-${{ github.ref }}-${{ github.job }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update-copyright:
    name: Update Copyright
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Source
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Update Copyright
        id: update-copyright
        uses: ./
        with:
          name: "Robert Lindley"
          license: Apache-2.0
          working-directory: ./scripts

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if [[ -n $(git status --porcelain -- scripts) ]]; then
            echo "detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create copyright update pull request
        id: create-pull-request
        if: steps.changes.outputs.detected == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update copyright headers
          title: "Update copyright headers"
          body: "Applies current Apache-2.0 copyright headers to shell sources."
          branch: automation/copyright-headers
          delete-branch: true
