name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bash-tests:
    name: BATS and shell quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install shell test tools
        id: install-shell-test-tools
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y bats shellcheck

      - name: Run BATS and shell quality tests
        id: run-shell-tests
        run: |
          set -euo pipefail
          chmod +x scripts/run_tests.sh scripts/check_shell_quality.sh
          ./scripts/run_tests.sh

  action-integration:
    name: Local action integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create sample file
        id: create-sample-file
        run: |
          set -euo pipefail
          mkdir -p src
          echo "// sample" > src/example.js
          printf '#!/usr/bin/env python3\nprint("sample")\n' > src/example.py

      - name: Run action from repository
        id: run-action
        uses: ./
        with:
          name: "Test Runner"
          license: MIT
          working-directory: ./src

      - name: Validate calling repository updates
        id: validate-updates
        run: |
          set -euo pipefail
          year=$(date +%Y)
          grep -F "Copyright (c) $year Test Runner" src/example.js
          grep -F "Copyright (c) $year Test Runner" src/example.py
          grep -F "Permission is hereby granted, free of charge" src/example.js
          grep -F "Permission is hereby granted, free of charge" src/example.py
          grep -F "// sample" src/example.js
          grep -F 'print("sample")' src/example.py
          if [[ -z $(git status --porcelain -- src/example.js src/example.py) ]]; then
            echo "Expected the action to modify the calling repository" >&2
            exit 1
          fi
          cp src/example.js /tmp/example.js.once
          cp src/example.py /tmp/example.py.once

      - name: Run action a second time
        id: run-action-again
        uses: ./
        with:
          name: "Test Runner"
          license: MIT
          working-directory: ./src

      - name: Validate idempotency
        id: validate-idempotency
        run: |
          set -euo pipefail
          cmp /tmp/example.js.once src/example.js
          cmp /tmp/example.py.once src/example.py
